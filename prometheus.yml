global:
  scrape_interval: 1s
  evaluation_interval: 1s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "node"
    scrape_interval: 1s
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "python_app"
    scrape_interval: 1s
    static_configs:
      - targets: ["localhost:18000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
